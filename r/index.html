<style>
*{box-sizing:border-box;margin:0;padding:0}

<script>
(function () {
  var ANIMALS = {
    wolf: "狼", deer: "鹿", fox: "狐狸", hedgehog: "刺猬",
    whale: "鲸鱼", otter: "水獭", owl: "猫头鹰", hummingbird: "蜂鸟",
    snow_leopard: "雪豹", peacock: "孔雀", camel: "骆驼", crow: "乌鸦"
  };
  var key = new URLSearchParams(location.search).get("a") || "";
  if (!Object.prototype.hasOwnProperty.call(ANIMALS, key)) key = "default";
  var name = ANIMALS[key] || "动物";
  var img = document.getElementById("card");

  var og = document.querySelector('meta[property="og:title"]');
  if (og) og.setAttribute("content", document.title);
  var ogi = document.querySelector('meta[property="og:image"]');
  if (ogi) ogi.setAttribute("content", new URL(img.src, location.href).href);
})();
